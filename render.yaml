# Render Blueprint: сервер NUMMAZA + база PostgreSQL.
# Render → New → Blueprint → выберите репозиторий с этим файлом.
services:
  - type: web
    name: nummaza
    runtime: node
    branch: main      # сайт деплоится из main
    plan: free
    region: frankfurt
    buildCommand: cd server && npm ci --omit=dev
    startCommand: cd server && node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: nummaza-db
          property: connectionString
      - key: APK_URL   # последний APK для кнопки «Скачать» в приложении (релизы GitHub)
        value: https://github.com/abilok000-prog/NUMMAZA/releases/latest/download/NUMMAZA.apk
      - key: ALLOWED_ORIGINS
        sync: false   # при необходимости: другие сайты через запятую
databases:
  - name: nummaza-db
    plan: free
    region: frankfurt
